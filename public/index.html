<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="tg-token" content="__TOKEN__">
  <title>TrashGuard</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/icons.css">
  <link rel="stylesheet" href="/live.css">
  <link rel="stylesheet" href="/startup.css">
  <link rel="stylesheet" href="/disk.css">
  <link rel="stylesheet" href="/clean.css">
  <link rel="stylesheet" href="/log.css">
</head>
<body>
  <header class="topbar">
    <h1 class="brand"><span class="brand-mark" aria-hidden="true"></span>TrashGuard</h1>
    <nav class="tabs" role="tablist" aria-label="Faner" id="tabs">
      <button type="button" role="tab" class="tab" id="tab-button-live" data-tab="live" aria-controls="tab-live" aria-selected="true">Live <span class="tab-pill" id="tab-live-value" data-res="cpu" hidden></span></button>
      <button type="button" role="tab" class="tab" id="tab-button-startup" data-tab="startup" aria-controls="tab-startup" aria-selected="false">Opstart <span class="tab-badge" id="tab-startup-dead" hidden></span><span class="tab-badge is-slow" id="tab-startup-slow" title="Seneste opstart var langsommere end normalt" hidden><span class="bi bi-graph-up-arrow" aria-hidden="true"></span><span class="visually-hidden">langsommere opstart</span></span></button>
      <button type="button" role="tab" class="tab" id="tab-button-disk" data-tab="disk" aria-controls="tab-disk" aria-selected="false">Disk</button>
      <button type="button" role="tab" class="tab" id="tab-button-clean" data-tab="clean" aria-controls="tab-clean" aria-selected="false">Ryd op</button>
      <button type="button" role="tab" class="tab" id="tab-button-log" data-tab="log" aria-controls="tab-log" aria-selected="false">Log</button>
    </nav>
    <p class="status" id="status"><span class="beat" id="beat" aria-hidden="true"></span><span class="status-text" id="status-text">Forbinder…</span></p>
    <button type="button" class="icon-button lang-button" id="lang"></button>
    <button type="button" class="icon-button" id="refresh" aria-label="Opdatér opstart og tjenester" title="Opdatér opstart og tjenester"><span class="bi bi-arrow-clockwise" aria-hidden="true"></span></button>
  </header>

  <p class="banner" id="admin-banner" hidden><span class="bi bi-shield-exclamation" aria-hidden="true"></span><span><strong>Uden administrator:</strong> tjenester, opgaver og fælles opstartsposter kan kun ses. Start via genvejen.</span></p>
  <p class="banner banner-problem" id="problem" role="alert" hidden><span class="bi bi-exclamation-triangle" aria-hidden="true"></span><span id="problem-text"></span></p>

  <main>
    <section class="panel" id="tab-live" role="tabpanel" aria-labelledby="tab-button-live"></section>
    <section class="panel" id="tab-startup" role="tabpanel" aria-labelledby="tab-button-startup" hidden></section>
    <section class="panel" id="tab-disk" role="tabpanel" aria-labelledby="tab-button-disk" hidden></section>
    <section class="panel" id="tab-clean" role="tabpanel" aria-labelledby="tab-button-clean" hidden></section>
    <section class="panel" id="tab-log" role="tabpanel" aria-labelledby="tab-button-log" hidden></section>
  </main>

  <p class="toast" id="toast" role="status" hidden></p>
  <script src="/app.js" type="module"></script>
</body>
</html>
